[workspace]
resolver = "2"
members = ["crates/aftermath-core", "crates/aftermath-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mtk339900/aftermath"
rust-version = "1.81"

[workspace.dependencies]
aftermath-core = { path = "crates/aftermath-core" }
anyhow = "1"
clap = { version = "4.6", features = ["derive", "color"] }
git2 = { version = "0.20", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
thiserror = "2"
tree-sitter = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
sha2 = "0.10"
toml = "1"
tempfile = "3"
jsonschema = "0.58"
insta = "1.49"

[profile.release]
lto = "thin"
strip = true
